<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 테트리스</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #202028;
            color: #fff;
            font-family: 'Press Start 2P', cursive; /* 레트로 게임 폰트 느낌 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            align-items: flex-start;
        }

        canvas {
            border: 2px solid #555;
            background-color: #000;
            display: block;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 150px;
        }

        .info-box {
            background: #444;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .info-label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 10px;
            display: block;
        }

        .info-value {
            font-size: 1.2rem;
            color: #fff;
        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 15px 10px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background: #c2185b;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 0.6rem;
            color: #888;
            line-height: 1.5;
            text-align: center;
        }

        /* 모달 스타일 (게임 오버 등) */
        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none; /* 기본적으로 숨김 */
        }

        #game-overlay h1 {
            font-size: 3rem;
            color: #ff5252;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <div class="sidebar">
            <div class="info-box">
                <span class="info-label">SCORE</span>
                <span id="score" class="info-value">0</span>
            </div>
            
            <div class="info-box">
                <span class="info-label">LEVEL</span>
                <span id="level" class="info-value">1</span>
            </div>

            <button id="start-btn">게임 시작</button>
            
            <div class="controls-hint">
                <p>← → : 이동</p>
                <p>↑ : 회전</p>
                <p>↓ : 빠르게 내리기</p>
            </div>
        </div>
    </div>

    <div id="game-overlay">
        <h1>GAME OVER</h1>
        <button id="restart-btn" style="width: auto; padding: 15px 30px;">다시 시작</button>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const overlay = document.getElementById('game-overlay');

        // 게임 설정 상수로 크기 확대 (20px -> 24px per block for better visibility)
        context.scale(20, 20); 

        // 테트리스 조각 모양 정의
        const PIECES = 'ILJOTSZ';
        const COLORS = [
            null,
            '#FF0D72', // T (Magenta)
            '#0DC2FF', // I (Cyan)
            '#0DFF72', // S (Green)
            '#F538FF', // Z (Purple-ish, actually standard is Red usually but let's stick to visible colors)
            '#FF8E0D', // L (Orange)
            '#FFE138', // O (Yellow)
            '#3877FF', // J (Blue)
        ];
        
        // 표준 테트리스 색상 매핑 수정
        const PIECE_COLORS = {
            'T': '#A000F0', // Purple
            'I': '#00F0F0', // Cyan
            'S': '#00F000', // Green
            'Z': '#F00000', // Red
            'L': '#F0A000', // Orange
            'J': '#0000F0', // Blue
            'O': '#F0F000'  // Yellow
        };

        // 아레나(게임 보드) 생성 (12x20)
        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0
        };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;
        let requestId = null;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }
        
        // 각 숫자에 맞는 색상 가져오기
        function getColor(value) {
            // value 1-7 corresponds to pieces
            const types = ['I', 'L', 'J', 'O', 'Z', 'S', 'T'];
            if (value > 0 && value <= 7) {
                return PIECE_COLORS[types[value-1]];
            }
            return null;
        }

        // 그리기 함수
        function draw() {
            // 배경 지우기
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // value에 따라 색상 결정 (여기서는 단순화를 위해 인덱스 사용하거나 직접 매핑)
                        // createPiece에서 설정한 값(1~7)을 사용
                        const types = [null, 'I', 'L', 'J', 'O', 'Z', 'S', 'T'];
                        context.fillStyle = PIECE_COLORS[types[value]];
                        
                        // 블록 그리기 (약간의 입체감을 위해 테두리 추가)
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'rgba(255,255,255,0.5)';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // 충돌 감지
        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 아레나에 블록 고정
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 블록 회전
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            // 벽 차기 (Wall Kick) - 회전 시 벽에 겹치면 밀어내기
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix.length) {
                    rotate(player.matrix, -dir); // 실패 시 원복
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            const type = pieces[pieces.length * Math.random() | 0];
            player.matrix = createPiece(type);
            
            // 값을 createPiece의 인덱스가 아닌 실제 색상 매핑을 위해 type별 고유 번호 할당 필요
            // createPiece 함수 내에서 이미 1~7 값을 할당함.
            
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) -
                           (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                overlay.style.display = 'flex';
                cancelAnimationFrame(requestId);
                isPaused = true;
                startBtn.disabled = false;
                startBtn.innerText = "게임 오버";
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        // 라인 삭제 및 점수 계산
        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                rowCount++;
            }

            if (rowCount > 0) {
                // 점수 계산: 1줄 10, 2줄 30, 3줄 60, 4줄 100 * 레벨
                const lineScores = [0, 10, 30, 60, 100];
                player.score += lineScores[rowCount] * player.level;
                player.lines += rowCount;
                
                // 레벨업 (10줄마다)
                player.level = Math.floor(player.lines / 10) + 1;
                
                // 속도 증가
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
            }
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            levelElement.innerText = player.level;
        }

        function update(time = 0) {
            if (isPaused || isGameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestId = requestAnimationFrame(update);
        }

        // 키보드 조작
        document.addEventListener('keydown', event => {
            if (isPaused || isGameOver) return;

            if (event.keyCode === 37) { // Left
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right
                playerMove(1);
            } else if (event.keyCode === 40) { // Down
                playerDrop();
            } else if (event.keyCode === 38) { // Up (Rotate)
                playerRotate(1);
            }
        });

        // 게임 시작/재시작 로직
        function startGame() {
            // 초기화
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            updateScore();
            dropInterval = 1000;
            isGameOver = false;
            isPaused = false;
            overlay.style.display = 'none';
            
            playerReset();
            update();
            
            startBtn.innerText = "게임 중...";
            startBtn.disabled = true;
        }

        startBtn.addEventListener('click', () => {
            if (isGameOver || isPaused) {
                startGame();
            }
        });

        restartBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
